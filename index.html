<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>โปรแกรมเบิก</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fa;color:#222;padding-bottom:78px}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0 0 5px}.wallet{font-size:28px;font-weight:800}
main{padding:14px;max-width:800px;margin:auto}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}
h2{font-size:18px;margin:0 0 12px}label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #d5d8df;border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;cursor:pointer}.primary{background:#111827;color:white}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}.gray{background:#eef0f4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{display:flex;gap:8px}.status button{flex:1}.status .active{outline:3px solid #111827}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;border-radius:12px;background:#f7f7f8}.stat b{display:block;font-size:20px;margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;padding:7px 2px;font-size:11px;color:#555}nav button.active{color:#111827;font-weight:800}
.item{border:1px solid #e2e4e8;border-radius:12px;padding:11px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#666;font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
.multi{min-height:42px}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{margin:0;font-weight:500;background:#f1f3f6;padding:7px 9px;border-radius:9px}.checks input{width:auto}
</style>
</head>
<body>
<header><h1>💰 โปรแกรมเบิก</h1><div>กระเป๋าเงิน</div><div class="wallet" id="wallet">30,000.00 บาท</div></header>
<main id="app"></main>
<nav>
<button data-page="home">🏠<br>ยอดเบิก</button>
<button data-page="summary">📊<br>สรุป</button>
<button data-page="reserve">📦<br>สำรอง</button>
<button data-page="history">📜<br>ประวัติ</button>
<button data-page="settings">⚙️<br>ตั้งค่า</button>
</nav>
<script>
const houses=['วริศ','ศิลา','ภูดิส','สามชั้น','แพรี่','ปุณปุณ','ริชชี่','เค้กส้ม','พริกเพชร','อื่นๆ'];
const secretaries=['อุษา','เดีย','แนน','ใหม่','นิว','หญิง','เกด','พริก','แจ๋ว','หมิว'];
const KEY='berk_new_v1';
const app=document.getElementById('app');
const date=document.getElementById('date');
const house=document.getElementById('house');
const st=document.getElementById('st');
const amount=document.getElementById('amount');
const sec=document.getElementById('sec');
const paid=document.getElementById('paid');
const calc=document.getElementById('calc');
const sd=document.getElementById('sd');
const sum=document.getElementById('sum');
const rd=document.getElementById('rd');
const rv=document.getElementById('rv');
const from=document.getElementById('from');
const to=document.getElementById('to');
const hist=document.getElementById('hist');
const adj=document.getElementById('adj');
const newh=document.getElementById('newh');
const news=document.getElementById('news');

let db=JSON.parse(localStorage.getItem(KEY)||'null')||{wallet:30000,adjust:[],records:[],statuses:{},secretaries:[...secretaries],houses:[...houses],secretaryPaid:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function money(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function status(h,d=today()){return db.statuses[d+'|'+h]||'green'}
function fee(r){return r.house==='อื่นๆ'?0:r.amount*.10}
function net(r){return r.house==='อื่นๆ'?r.amount:r.amount*.90}
function pageNav(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
let page='home';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
function render(){document.getElementById('wallet').textContent=money(db.wallet)+' บาท';pageNav(page);({home,summary,reserve,history,settings}[page])()}
function home(){
app.innerHTML=`<section class=card><h2>ทำรายการเบิก</h2>
<label>วันที่</label><input id=date type=date value="${today()}">
<label>บ้าน</label><select id=house>${db.houses.map(h=>`<option>${h}</option>`).join('')}</select>
<div id=st></div><label>ยอดเบิกเต็มจำนวน</label><input id=amount type=number min=0 step=0.01 placeholder="เช่น 3,000">
<label>เลขา</label><select id=sec>${db.secretaries.map(s=>`<option>${s}</option>`).join('')}</select>
<label>สถานะการโอนลูกค้า</label><select id=paid><option value=no>ยังไม่โอนลูกค้า</option><option value=yes>โอนลูกค้าแล้ว</option></select>
<div id=calc class=card style="background:#f7f7f8;margin-top:12px"></div>
<button class="primary" style="width:100%;margin-top:8px" onclick="addRecord()">บันทึกรายการ</button></section>`;
document.getElementById('house').onchange=updateForm;document.getElementById('amount').oninput=updateForm;document.getElementById('date').onchange=updateForm;updateForm()
}
function updateForm(){
let h=house.value,d=date.value,a=+amount.value||0,s=status(h,d);
st.innerHTML=`<div class=status><button class="${s==='green'?'green active':''}" onclick="setStatus('${h}','${d}','green')">🟢 เบิกได้</button><button class="${s==='yellow'?'yellow active':''}" onclick="setStatus('${h}','${d}','yellow')">🟡 หยุดเบิก</button></div>`;
let r={house:h,amount:a};calc.innerHTML=`<div>ลูกค้าได้รับ: <b>${money(net(r))}</b> บาท</div><div>เลขา: <b>${money(fee(r))}</b> บาท</div>${s==='yellow'?'<div class="muted">เงินรายการนี้จะเป็นเงินสำรองของบ้าน และไม่คืนเข้ากระเป๋าทันที</div>':''}`;
}
function setStatus(h,d,s){db.statuses[d+'|'+h]=s;save()}
function addRecord(){
let a=+amount.value||0;if(a<=0)return alert('กรุณาใส่ยอดเบิก');
let r={id:Date.now(),date:date.value,house:house.value,amount:a,secretary:sec.value,paid:paid.value,returned:false};
let h=r.house,s=status(h,r.date);
if(paid.value==='yes'){db.wallet-=a}
db.records.push(r);save();alert('บันทึกแล้ว');page='history';render()
}
function filteredRecords(date,hs){
return db.records.filter(r=>(!date||r.date===date)&&(!hs.length||hs.includes(r.house)))
}
function summary(){
app.innerHTML=`<section class=card><h2>📊 สรุป</h2><label>วันที่</label><input id=sd type=date value="${today()}">
<label>เลือกบ้าน (เลือกได้หลายบ้าน)</label><div class=checks id=houses></div><div id=sum></div></section>`;
document.getElementById('houses').innerHTML=db.houses.map((h,i)=>`<label><input type=checkbox value="${h}" onchange="drawSummary()"> ${h}</label>`).join('');
sd.onchange=drawSummary;drawSummary()
}
function selected(){return [...document.querySelectorAll('#houses input:checked')].map(x=>x.value)}
function drawSummary(){
let d=sd.value,hs=selected(),rs=filteredRecords(d,hs),total=rs.reduce((x,r)=>x+r.amount,0);
let rows=db.houses.filter(h=>!hs.length||hs.includes(h)).map(h=>{
let x=rs.filter(r=>r.house===h),t=x.reduce((a,r)=>a+r.amount,0),res=x.filter(r=>status(h,d)==='yellow'&&!r.returned).reduce((a,r)=>a+r.amount,0),f=x.reduce((a,r)=>a+fee(r),0),p=x.filter(r=>r.paid==='yes').reduce((a,r)=>a+fee(r),0);
return `<div class=item><div class=row><b>${h}</b><span class="pill ${status(h,d)==='green'?'green':'yellow'}">${status(h,d)==='green'?'เบิกได้':'หยุดเบิก'}</span></div><div>ยอดทั้งหมด: <b>${money(t)}</b></div><div>ยอดเบิกได้: ${money(status(h,d)==='green'?t:0)}</div><div>ยอดหยุดเบิก: ${money(status(h,d)==='yellow'?t:0)}</div><div>ยอดสำรอง: <b>${money(res)}</b></div><div>เลขา: ${money(f)}</div><div>ยอดโอนเลขา: ${money(p)}</div></div>`}).join('');
sum.innerHTML=`<div class=stats><div class=stat>ยอดทั้งหมด<b>${money(total)}</b></div><div class=stat>บ้านที่เลือก<b>${hs.length||'ทุกบ้าน'}</b></div></div>${rows}`
}
function reserve(){
app.innerHTML=`<section class=card><h2>📦 เงินสำรอง</h2><label>ดูวันที่</label><input id=rd type=date value="${today()}" onchange="drawReserve()"><div id=rv></div></section>`;drawReserve()
}
function drawReserve(){
let d=rd.value;rv.innerHTML=db.houses.map(h=>{let rs=db.records.filter(r=>r.date===d&&r.house===h),x=status(h,d)==='yellow'?rs.reduce((a,r)=>a+r.amount,0):0;return `<div class=item><div class=row><b>${h}</b><span>${status(h,d)==='green'?'🟢 เบิกได้':'🟡 หยุดเบิก'}</span></div>สำรอง: <b>${money(x)}</b> บาท${x?'<div class=muted>จะคืนเข้ากระเป๋าในวันที่บ้านนี้เป็นเบิกได้</div>':''}</div>`}).join('')
}
function history(){
app.innerHTML=`<section class=card><h2>📜 ประวัติ</h2><div class=grid><div><label>จากวันที่</label><input id=from type=date></div><div><label>ถึงวันที่</label><input id=to type=date></div></div><button class=primary onclick="drawHistory()">ค้นหา</button><div id=hist></div></section>`;drawHistory()
}
function drawHistory(){
let f=from.value,t=to.value,rs=db.records.filter(r=>(!f||r.date>=f)&&(!t||r.date<=t));
hist.innerHTML=rs.slice().sort((a,b)=>b.id-a.id).map(r=>`<div class=item><div class=row><b>${r.house}</b><span>${r.date}</span></div><div>เบิก ${money(r.amount)} | ลูกค้า ${money(net(r))}</div><div>เลขา ${r.secretary} ${money(fee(r))}</div><div>${r.paid==='yes'?'✅ โอนลูกค้าแล้ว':'⏳ ยังไม่โอนลูกค้า'}</div><div class=grid style="margin-top:8px"><button class=gray onclick="editRecord(${r.id})">แก้ไข</button><button class=danger onclick="delRecord(${r.id})">ลบรายการนี้</button></div></div>`).join('')||'<p class=muted>ยังไม่มีรายการ</p>'
}
function editRecord(id){let r=db.records.find(x=>x.id===id);if(!r)return;let a=prompt('แก้ยอดเบิก',r.amount);if(a===null)return;a=+a;if(a<=0)return;let oldPaid=r.paid==='yes',newPaid=confirm('รายการนี้โอนลูกค้าแล้วหรือไม่?');if(oldPaid&&!newPaid)db.wallet+=r.amount;if(!oldPaid&&newPaid)db.wallet-=a;r.amount=a;r.paid=newPaid?'yes':'no';save();page='history';render()}
function delRecord(id){let r=db.records.find(x=>x.id===id);if(!r||!confirm('ลบรายการนี้ใช่ไหม?'))return;if(r.paid==='yes')db.wallet+=r.amount;db.records=db.records.filter(x=>x.id!==id);save()}
function settings(){
app.innerHTML=`<section class=card><h2>⚙️ ตั้งค่า</h2><label>ปรับกระเป๋าเงิน</label><input id=adj type=number placeholder="ใส่จำนวน เช่น 500 หรือ -500"><button class=primary style="margin-top:7px" onclick="adjustWallet()">บันทึกการปรับยอด</button><hr><div class=row><b>ยอดกระเป๋า</b><b>${money(db.wallet)}</b></div></section>
<section class=card><h2>🏠 บ้าน</h2><input id=newh placeholder="ชื่อบ้านใหม่"><button class=primary style="margin-top:7px" onclick="addHouse()">เพิ่มบ้าน</button><div>${db.houses.map(h=>`<div class=item>${h}</div>`).join('')}</div></section>
<section class=card><h2>👩‍💼 เลขา</h2><input id=news placeholder="ชื่อเลขาใหม่"><button class=primary style="margin-top:7px" onclick="addSec()">เพิ่มเลขา</button><div>${db.secretaries.map(s=>`<div class=item>${s}</div>`).join('')}</div></section>
<section class=card><h2>🧾 ประวัติปรับกระเป๋า</h2>${db.adjust.slice().reverse().map(x=>`<div class=item>${x.date} — ${x.amount>=0?'+':''}${money(x.amount)} บาท</div>`).join('')||'<span class=muted>ยังไม่มี</span>'}</section>`
}
function adjustWallet(){let a=+adj.value||0;if(!a)return;db.wallet+=a;db.adjust.push({date:today(),amount:a});save();page='settings';render()}
function addHouse(){let h=newh.value.trim();if(!h)return;if(db.houses.includes(h))return alert('มีบ้านนี้แล้ว');db.houses.push(h);save();page='settings';render()}
function addSec(){let s=news.value.trim();if(!s)return;if(db.secretaries.includes(s))return alert('มีเลขานี้แล้ว');db.secretaries.push(s);save();page='settings';render()}
render()
</script>
</body></html>
